# Substitui por completo o application.yaml principal durante os testes.
spring:
  application:
    name: doceflux-api
  datasource:
    url: jdbc:postgresql://localhost:5433/doceflux_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  security:
    jwt:
      secret: test-only-secret-key-minimum-32-bytes-long-0000
      expiration-seconds: 3600
