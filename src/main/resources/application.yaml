spring:
  application:
    name: doceflux-api
  datasource:
    url: jdbc:postgresql://localhost:5433/doceflux?useSSL=false
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect