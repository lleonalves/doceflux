spring:
  application:
    name: doceflux-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/doceflux}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # Vazio = cadastro aberto, sem código de convite.
    registration-secret: ${REGISTRATION_SECRET:}
    jwt:
      secret: ${JWT_SECRET:dev-local-secret-key-minimum-32-bytes-long}
      expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:28800}
