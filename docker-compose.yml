services:
  postgres:
    image: postgres:15-alpine
    container_name: doceflux-postgres
    environment:
      POSTGRES_DB: doceflux
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: